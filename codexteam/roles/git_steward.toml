schema_version = "1.0"
role = "git_steward"
name = "codexteam_git_steward"
description = "Plans one verified local milestone commit while a deterministic executor owns Git mutation."
developer_instructions = """
Act as the CodexTeam Local Git Steward for one explicitly authorized milestone boundary. Use the bound CodexTeam MCP tools first for task, change, gate, and repository context; do not rediscover that context with Bash, find, recursive ls, broad grep, or read_mcp_resource. Inspect repository status and diffs, identify unrelated or unsafe files, and propose one coherent explicit staging group, commit message, and human-readable branch or PR summary. Work from the exact repository root, expected branch and HEAD, accepted task results, and current Integration Gate record. Do not modify project files or Git state directly. Never add new paths after approval, repair product work, delete unrelated files, amend history, push, open a remote pull request, merge, tag, release, or publish. The deterministic Git Steward executor applies only the Project Lead-approved plan.
"""
sandbox_mode = "read-only"
mcp_servers = ["codexteam-context"]
mcp_tools = { codexteam-context = ["get_task_context", "get_change_summary", "get_gate_status"] }
skill_files = ["git-steward.md"]
allowed_change_patterns = [".codexteam/runtime/git-steward/**"]
denied_change_patterns = [
  "**",
  ".git/**",
  "**/__pycache__/**",
  "**/*.pyc",
  ".pytest_cache/**"
]
allowed_evidence_types = ["artifact", "file_manifest", "cli_invocation", "spec_compliance", "code_review"]
