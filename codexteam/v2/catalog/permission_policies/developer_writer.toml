schema_version = "2.0"
kind = "permission_policy"
definition_version = "1"
policy_id = "developer_writer"
default_effect = "deny"
[[rules]]
rule_id = "read-project"
exception_class = "hard"
effect = "allow"
operation = "read"
resource = "project_path"
resource_pattern = "project/**"
[[rules]]
rule_id = "write-source"
exception_class = "hard"
effect = "allow"
operation = "write"
resource = "project_path"
resource_pattern = "project/src/**"
[[rules]]
rule_id = "write-tests"
exception_class = "hard"
effect = "allow"
operation = "write"
resource = "project_path"
resource_pattern = "project/tests/**"
[[rules]]
rule_id = "execute-checks"
exception_class = "hard"
effect = "allow"
operation = "execute"
resource = "process"
resource_pattern = "process"
[[rules]]
rule_id = "send-mailbox"
exception_class = "hard"
effect = "allow"
operation = "send"
resource = "mailbox"
resource_pattern = "mailbox"
