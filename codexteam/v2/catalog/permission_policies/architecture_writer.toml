schema_version = "2.0"
kind = "permission_policy"
definition_version = "1"
policy_id = "architecture_writer"
default_effect = "deny"
[[rules]]
rule_id = "read-project"
exception_class = "hard"
effect = "allow"
operation = "read"
resource = "project_path"
resource_pattern = "project/**"
[[rules]]
rule_id = "write-architecture"
exception_class = "hard"
effect = "allow"
operation = "write"
resource = "project_path"
resource_pattern = "project/docs/architecture/**"
[[rules]]
rule_id = "send-mailbox"
exception_class = "hard"
effect = "allow"
operation = "send"
resource = "mailbox"
resource_pattern = "mailbox"
