schema_version = "2.0"
kind = "permission_policy"
definition_version = "1"
policy_id = "repository_readonly"
default_effect = "deny"
[[rules]]
rule_id = "read-project"
exception_class = "hard"
effect = "allow"
operation = "read"
resource = "project_path"
resource_pattern = "project/**"
[[rules]]
rule_id = "send-mailbox"
exception_class = "hard"
effect = "allow"
operation = "send"
resource = "mailbox"
resource_pattern = "mailbox"
