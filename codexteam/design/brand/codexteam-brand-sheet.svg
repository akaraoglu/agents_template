<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">CodexTeam monochrome identity review sheet</title>
  <desc id="desc">The CodexTeam emblem, wordmark, app icon, geometry, palette, scale behavior, and banner treatment.</desc>
  <defs>
    <g id="mark-coal">
      <path d="M48 12H20L12 20V44L20 52H48" fill="none" stroke="#191B1F" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M24 24H48M36 24V44" fill="none" stroke="#191B1F" stroke-width="6" stroke-linecap="square"/>
    </g>
    <g id="mark-mist">
      <path d="M48 12H20L12 20V44L20 52H48" fill="none" stroke="#F2F3F5" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M24 24H48M36 24V44" fill="none" stroke="#F2F3F5" stroke-width="6" stroke-linecap="square"/>
    </g>
    <g id="icon">
      <rect width="64" height="64" rx="6" fill="#191B1F"/>
      <path d="M48 12H20L12 20V44L20 52H48" fill="none" stroke="#F2F3F5" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M24 24H48M36 24V44" fill="none" stroke="#F2F3F5" stroke-width="6" stroke-linecap="square"/>
    </g>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#D7D9DD" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#E9EAEC"/>
  <rect x="64" y="56" width="1472" height="112" rx="4" fill="#F2F3F5"/>
  <text x="104" y="106" font-family="Noto Sans, Inter, Segoe UI, sans-serif" font-size="27" font-weight="750" fill="#191B1F">CodexTeam monochrome identity</text>
  <text x="104" y="138" font-family="Noto Sans, Inter, Segoe UI, sans-serif" font-size="17" fill="#686C72">Bounded orchestration. Verified delivery. Precise geometry.</text>
  <text x="1492" y="122" text-anchor="end" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#191B1F">REVIEW / DESIGN 04</text>

  <rect x="64" y="192" width="720" height="246" rx="4" fill="#F2F3F5"/>
  <text x="104" y="234" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#686C72">LIGHT LOCKUP</text>
  <g transform="translate(102 270) scale(1.9)"><use href="#mark-coal"/></g>
  <text x="252" y="370" fill="#191B1F" font-family="Noto Sans, Inter, Segoe UI, sans-serif" font-size="76" font-weight="650">Codex<tspan font-weight="800">Team</tspan></text>

  <rect x="816" y="192" width="720" height="246" rx="4" fill="#191B1F"/>
  <text x="856" y="234" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#AEB1B6">DARK LOCKUP</text>
  <g transform="translate(854 270) scale(1.9)"><use href="#mark-mist"/></g>
  <text x="1004" y="370" fill="#F2F3F5" font-family="Noto Sans, Inter, Segoe UI, sans-serif" font-size="76" font-weight="650">Codex<tspan font-weight="800">Team</tspan></text>

  <rect x="64" y="470" width="472" height="458" rx="4" fill="#F2F3F5"/>
  <text x="104" y="514" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#686C72">APP ICON / SCALE</text>
  <g transform="translate(104 558) scale(2.5)"><use href="#icon"/></g>
  <g transform="translate(296 654)"><use href="#icon"/></g>
  <g transform="translate(388 686) scale(.5)"><use href="#icon"/></g>
  <g transform="translate(444 694) scale(.25)"><use href="#icon"/></g>
  <text x="104" y="874" font-family="ui-monospace, monospace" font-size="14" fill="#686C72">160 / 64 / 32 / 16 px</text>

  <rect x="568" y="470" width="464" height="458" rx="4" fill="#F2F3F5"/>
  <text x="608" y="514" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#686C72">64-UNIT CONSTRUCTION</text>
  <rect x="640" y="554" width="320" height="320" fill="url(#grid)"/>
  <g transform="translate(640 554) scale(5)"><use href="#mark-coal"/></g>

  <rect x="1064" y="470" width="472" height="214" rx="4" fill="#F2F3F5"/>
  <text x="1104" y="514" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#686C72">TWO-COLOR SYSTEM</text>
  <rect x="1104" y="552" width="176" height="88" fill="#191B1F"/>
  <text x="1120" y="623" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#F2F3F5">COAL #191B1F</text>
  <rect x="1312" y="552" width="176" height="88" fill="#F2F3F5" stroke="#D7D9DD"/>
  <text x="1328" y="623" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#191B1F">MIST #F2F3F5</text>

  <rect x="1064" y="716" width="472" height="212" rx="4" fill="#191B1F"/>
  <g transform="translate(1092 750) scale(1.8)"><use href="#mark-mist"/></g>
  <text x="1230" y="817" fill="#F2F3F5" font-family="Noto Sans, Inter, Segoe UI, sans-serif" font-size="44" font-weight="650">Codex<tspan font-weight="800">Team</tspan></text>
  <text x="1232" y="852" fill="#F2F3F5" font-family="ui-monospace, monospace" font-size="11" font-weight="650" letter-spacing="1">BOUNDED ORCHESTRATION</text>
  <rect x="1096" y="888" width="400" height="2" fill="#F2F3F5"/>
</svg>
